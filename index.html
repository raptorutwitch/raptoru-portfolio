<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAPTORU_ - Creative Studio</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{background:#0f0f0f;color:#fff;font-family:'Segoe UI',Arial,sans-serif;line-height:1.6}header{background:linear-gradient(135deg,#1a1a1a 0%,#2a1a1a 100%);padding:60px 20px;text-align:center;border-bottom:3px solid #ff6b00}header h1{font-size:3.5rem;margin:20px 0;background:linear-gradient(135deg,#fff,#ff6b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}header p{font-size:1.1rem;color:#aaa;margin:10px 0}.nav{max-width:1200px;margin:30px auto 0;display:flex;justify-content:center;gap:30px;flex-wrap:wrap}.nav button{background:transparent;color:#fff;border:2px solid #ff6b00;padding:10px 20px;cursor:pointer;border-radius:5px;font-size:1rem;transition:all 0.3s;font-weight:bold}. nav button:hover,.nav button.active{background:#ff6b00;color:#000}main{max-width:1400px;margin:0 auto;padding:40px 20px}.section{display:none}.section.active{display:block;animation:fadeIn 0.5s}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.section-title{font-size:2rem;margin:40px 0 30px;color:#ff6b00;border-bottom:2px solid #ff6b00;padding-bottom:10px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;margin:30px 0}.card{background:#1a1a1a;border:1px solid #333;border-radius:8px;overflow:hidden;cursor:pointer;transition:all 0.3s;position:relative}.card:hover{border-color:#ff6b00;transform:translateY(-5px);box-shadow:0 10px 30px rgba(255,107,0,0.2)}.card-img{width:100%;height:180px;object-fit:cover;display:block}.card-label{padding:12px;font-size:0.85rem;color:#aaa;text-align:center;background:#0f0f0f;border-top:1px solid #333}#lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:9999;align-items:center;justify-content:center;flex-direction:column}#lightbox.active{display:flex}#lightbox img,#lightbox video{max-width:90%;max-height:85%;border:2px solid #ff6b00;border-radius:8px;object-fit:contain}.lightbox-close{position:absolute;top:20px;right:30px;font-size:2.5rem;color:#fff;cursor:pointer;background:none;border:none;z-index:10000}.contact{background:#1a1a1a;padding:40px;border-radius:8px;max-width:600px;margin:60px auto;border:2px solid #ff6b00}.contact h2{color:#ff6b00;margin-bottom:20px}.contact input,.contact textarea{width:100%;padding:12px;margin:15px 0;background:#0f0f0f;border:1px solid #333;color:#fff;border-radius:5px;font-family:inherit}. contact input:focus,.contact textarea:focus{outline:none;border-color:#ff6b00;box-shadow:0 0 10px rgba(255,107,0,0.3)}.contact textarea{resize:vertical;min-height:120px}.btn-group{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.btn{padding:12px;border:2px solid #ff6b00;background:transparent;color:#ff6b00;cursor:pointer;border-radius:5px;font-weight:bold;transition:all 0.3s;font-size:1rem}.btn:hover{background:#ff6b00;color:#000}.btn:disabled{opacity:0.5;cursor:not-allowed}#status{margin-top:15px;padding:10px;border-radius:5px;text-align:center;display:none}.status-success{background:rgba(76,175,80,0.2);color:#4caf50;border:1px solid #4caf50}.status-error{background:rgba(244,67,54,0.2);color:#f44336;border:1px solid #f44336}footer{background:#1a1a1a;padding:30px;text-align:center;margin-top:60px;border-top:2px solid #ff6b00;color:#aaa}@media(max-width:768px){header h1{font-size:2rem}.nav{gap:15px}.nav button{padding:8px 15px;font-size:0.9rem}.gallery{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.btn-group{grid-template-columns:1fr}}</style>
</head>
<body>
    <header>
        <h1>RAPTORU_</h1>
        <p>Animateur 2D • Motion Designer • Graphiste</p>
        <p style="font-size:0.9rem;color:#ff6b00;margin-top:15px;">Créatrice de contenu • Disponible pour commandes</p>
        <div class="nav">
            <button class="active" onclick="showSection('portfolio')">Portfolio</button>
            <button onclick="showSection('contact')">Contact</button>
        </div>
    </header>

    <main>
        <!-- PORTFOLIO SECTION -->
        <div id="portfolio" class="section active">
            <!-- BADGES -->
            <div class="section-title">🎨 Badges</div>
            <div class="gallery" id="badgesGallery"></div>

            <!-- EMOTES -->
            <div class="section-title">😊 Emotes</div>
            <div class="gallery" id="emotesGallery"></div>

            <!-- MOTION DESIGN -->
            <div class="section-title">✨ Motion Design</div>
            <div class="gallery" id="motionGallery"></div>

            <!-- GALERIE -->
            <div class="section-title">🖼️ Galerie</div>
            <div class="gallery" id="galleryGallery"></div>
        </div>

        <!-- CONTACT SECTION -->
        <div id="contact" class="section">
            <div class="contact">
                <h2>Envoyez-moi un message</h2>
                <form id="contactForm">
                    <input type="text" id="name" placeholder="Ton nom" required>
                    <input type="email" id="email" placeholder="Ton email" required>
                    <textarea id="message" placeholder="Ton message" required></textarea>
                    <div class="btn-group">
                        <button type="button" class="btn" onclick="sendDiscord()">Discord</button>
                        <button type="submit" class="btn">Email</button>
                    </div>
                    <div id="status"></div>
                </form>
            </div>
        </div>
    </main>

    <div id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <img id="lightboxImg" style="display:none;">
        <video id="lightboxVideo" style="display:none;" controls></video>
    </div>

    <footer>
        <p><strong>RAPTORU_</strong> - Créatrice de contenu</p>
        <p style="margin-top:15px;">
            <a href="https://twitch.tv/raptorutwitch" style="color:#ff6b00;text-decoration:none;margin:0 10px;">Twitch</a>
            <a href="https://tiktok.com" style="color:#ff6b00;text-decoration:none;margin:0 10px;">TikTok</a>
        </p>
        <p style="margin-top:20px;font-size:0.85rem;">© 2024 Raptoru_</p>
    </footer>

    <script>
        const WEBHOOK = 'https://discord.com/api/webhooks/1503918156022808597/Bks1v2ZFlVTMPD2liRIBouvWNZmjgreyp9EjCwWKtnppcXp0h0zwFTUYQQoQsGvo-Bpw';

        // Pattern matching pour catégoriser les fichiers
        const patterns = {
            badges: ['UglyTitan', 'CartTitan', 'ArmoredTitan', 'ColossalTitan', 'BeastTitan', 'Nhs', 'Pablo'],
            emotes: ['Pog', 'Flex', 'Roooh', 'Grrr', 'Raptor', 'AhooV2', 'Kirby', 'Boude', 'HelloKnight', 'Bobombe', 'Waaah', 'Jaune', 'Bleu', 'Rose', 'rouge'],
            motion: ['Alerte', 'Transition', 'Cercle', 'Rectangle', 'Pixel', 'Appareil', 'Starting', 'Ending', 'Nuage', 'Video', 'Asset', 'Arrow', 'Dofus', 'CSC', 'Intermission', 'Waterbending', 'Rick', 'RB', 'Eeau', 'Cam', 'Page', 'Just', 'Jerry', 'Template', 'Feu', '[NHS]'],
            gallery: ['C21', 'Mikasa', 'Daki', 'Ayanokoji', 'Coqueline', 'Qilby', 'Avatar', 'bannière']
        };

        async function loadImages() {
            try {
                // Charge les images depuis les dossiers
                const imageFiles = await getFilesFromFolder('images');
                const videoFiles = await getFilesFromFolder('videos');
                
                categorizeAndDisplay(imageFiles, videoFiles);
            } catch (e) {
                console.log('Chargement dynamique non disponible, utilisation des patterns');
                loadWithPatterns();
            }
        }

        function loadWithPatterns() {
            // Fallback: charge basé sur les patterns
            const imagePath = 'images/';
            const videoPath = 'videos/';

            // Badges
            let badgesHtml = '';
            ['1. UglyTitan.png', '2. CartTtian.png', '5. ArmoredTitan.png', '6. ColossalTitan.png', '7. BeastTitan.png', 'Badge NhsBlanc.png', 'Badge NhsBleu.png', 'Badge NhsJaune.png', 'Badge NhsRose.png', 'Badge Nhsrouge.png'].forEach(f => {
                badgesHtml += createCard(imagePath + f, f);
            });
            document.getElementById('badgesGallery').innerHTML = badgesHtml;

            // Emotes
            let emotesHtml = '';
            ['Pog.png', 'Waaah.png', 'Flex megumin.png', 'Roooh.png', 'Grrr séance UV.png', 'Raptor sadge Fixed.png', 'AhooV2.gif', 'Kirby_Fixed.gif', 'Boude.gif', 'HelloKnight_.gif', 'Bobombe Finale.gif'].forEach(f => {
                emotesHtml += createCard(imagePath + f, f);
            });
            document.getElementById('emotesGallery').innerHTML = emotesHtml;

            // Motion
            let motionHtml = '';
            ['Alerte raid exemple.mp4', 'Appareil photo exemple 2.mp4', 'Cercle exemple.mp4', 'Pixel Exemple.mp4', 'Rectangle.mp4', 'Starting Screen.mp4', 'Ending Screen fixed.mp4', 'Nuage Classique.mp4', 'Video Terre.mp4', 'Video Wind.mp4', 'Vidéo Eau.mp4', 'Transition Feu.mp4', 'Dofus Alerte.mp4', 'Rick&Morty_1.mp4'].forEach(f => {
                motionHtml += createCard(videoPath + f, f);
            });
            document.getElementById('motionGallery').innerHTML = motionHtml;

            // Galerie
            let gallerieHtml = '';
            ['C21 Gif.gif', 'Mikasa TTS.gif', 'Filigraned Daki.png', 'Filigraned Ayanokoji.png', 'Coqueline Filigraned.png', 'Qilby Filigraned.png', 'Avatar.mp4'].forEach(f => {
                const path = f.endsWith('.mp4') ? videoPath : imagePath;
                gallerieHtml += createCard(path + f, f);
            });
            document.getElementById('galleryGallery').innerHTML = gallerieHtml;
        }

        function createCard(src, name) {
            const isVideo = src.endsWith('.mp4') || src.endsWith('.webm');
            const html = isVideo 
                ? `<div class="card" onclick="openLightbox('${src}', true)"><video style="width:100%;height:180px;object-fit:cover;" src="${src}"></video><div class="card-label">${name}</div></div>`
                : `<div class="card" onclick="openLightbox('${src}', false)"><img src="${src}" class="card-img" onerror="this.style.display='none'"><div class="card-label">${name}</div></div>`;
            return html;
        }

        function openLightbox(src, isVideo) {
            const lb = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImg');
            const vid = document.getElementById('lightboxVideo');
            
            if (isVideo) {
                img.style.display = 'none';
                vid.style.display = 'block';
                vid.src = src;
            } else {
                vid.style.display = 'none';
                img.style.display = 'block';
                img.src = src;
            }
            lb.classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.getElementById('lightboxVideo').pause();
        }

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function sendDiscord() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            
            if (!name || !email || !message) {
                showStatus('Remplis tous les champs!', false);
                return;
            }

            fetch(WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    embeds: [{
                        title: '📩 Nouveau Contact',
                        color: 16744192,
                        fields: [
                            { name: 'Nom', value: name, inline: true },
                            { name: 'Email', value: email, inline: true },
                            { name: 'Message', value: message }
                        ]
                    }]
                })
            }).then(() => {
                showStatus('Message envoyé sur Discord!', true);
                document.getElementById('contactForm').reset();
            }).catch(() => showStatus('Erreur Discord', false));
        }

        document.getElementById('contactForm').onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            
            fetch('https://formspree.io/f/mnqzjonb', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, message })
            }).then(() => {
                showStatus('Email envoyé!', true);
                document.getElementById('contactForm').reset();
            }).catch(() => showStatus('Erreur Email', false));
        };

        function showStatus(msg, success) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = success ? 'status-success' : 'status-error';
            status.style.display = 'block';
            setTimeout(() => status.style.display = 'none', 3000);
        }

        // Charge au démarrage
        loadWithPatterns();
    </script>
</body>
</html>
